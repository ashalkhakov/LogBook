# Logbook's Windows installer: what it carries and starts. The installer is
# gnustep-release-actions' msi (the runtime, WinUXTheme), the same as every
# app's; see its msi.sh for each name. The server is in the runtime beside
# it (logbook-server, its model next to it), started by hand.
NAME=Logbook
APPS="Logbook"
DEFAULT=Logbook
ICON=AppKit/Logbook.png
SUMMARY="A car logbook: what each vehicle needs and when, what it had done, and what it cost"
# No self-test here: it needs a server. The installed app still up after
# 25 seconds, its nibs loaded.
SMOKE_STAYS_UP=25
