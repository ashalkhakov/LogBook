# Logbook's AppImage: what it carries and starts. The image is
# gnustep-release-actions' appimage (the launcher, the runtime, the fonts),
# the same as every app's; see its appimage.sh for each name.
IMAGE=Logbook
NAME=Logbook
APPS="Logbook"
# The server is opt-in: nothing in the image serves unless asked so.
TOOLS="logbook-server"
DEFAULT=Logbook
#   <image> --server -StoreURL logbook.sqlite -Port 8080
#   ln -s <image> logbook-server
ROUTES="server,--server,logbook-server=logbook-server app,logbook=Logbook"
ENTRIES="Scripts/appimage/logbook.desktop=AppKit/Logbook.png"
# FreeCoreData's SQL stores, loaded by name (-StoreType PostgreSQL, MySQL).
LOADED="libCD*Store.so"
REQUIRE="Logbook.app/Resources/MainMenu.xib Logbook.app/Resources/Logbook.momd Logbook.app/Resources/Logbook.ormplans logbook-server Logbook.permissions.plist libCDPostgreSQLStore.so libCDMySQLStore.so"
# On a clean Ubuntu: the image's own server, and the app's self-test against it.
SMOKE_SCRIPT=Tests/appimage-smoke.sh
