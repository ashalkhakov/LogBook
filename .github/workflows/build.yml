name: Build

# Logbook, built, tested and installed the familiar way (make, make check,
# make install; Makefile.apple on Apple's platforms) by
# gnustep-release-actions' workflows, the same as every repository's. Every
# push builds and tests it and uploads what is installed: Logbook for macOS,
# for iOS (unsigned), for Linux (an AppImage, with its server) and for
# Windows (an installer, the server in its runtime). A v* tag
# (or a run started by hand with one) also releases them, attached to the
# tag's release (a pre-release when the tag has a '-'). What it builds on is
# in .github/pins.env.
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'A v* tag to build and release (empty: this branch, as artifacts)'
        required: false
        default: ''

# Pushes only: a push to a branch already shows its checks on the branch's
# pull request. A newer push supersedes the run before it; a release is
# never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: write

jobs:
  linux:
    uses: ashalkhakov/gnustep-release-actions/.github/workflows/linux.yml@v1
    with:
      tag: ${{ inputs.tag }}
      extra-packages: libsqlite3-dev libpq-dev libmariadb-dev

  windows:
    uses: ashalkhakov/gnustep-release-actions/.github/workflows/windows.yml@v1
    with:
      tag: ${{ inputs.tag }}
      extra-packages: sqlite3 postgresql libmariadbclient dlfcn
    secrets: inherit

  macos:
    uses: ashalkhakov/gnustep-release-actions/.github/workflows/macos.yml@v1
    with:
      tag: ${{ inputs.tag }}
      apps: Logbook=Logbook
    secrets: inherit

  ios:
    uses: ashalkhakov/gnustep-release-actions/.github/workflows/ios.yml@v1
    with:
      tag: ${{ inputs.tag }}
      apps: Logbook=Logbook
